x-app: &app-defaults
  image: ghcr.io/d-j-will/slackex:latest
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  mem_limit: 2g
  environment: &app-env
    DATABASE_URL: "ecto://postgres:${POSTGRES_PASSWORD}@postgres/slackex_prod"
    REDIS_URL: "redis://redis:6379"
    PHX_HOST: "chat.davewil.dev"
    PHX_SERVER: "true"
    PORT: "4000"
    SECRET_KEY_BASE: "${SECRET_KEY_BASE}"
    CLOAK_KEY: "${CLOAK_KEY}"
    CLOAK_HMAC_SECRET: "${CLOAK_HMAC_SECRET}"
    GUARDIAN_SECRET_KEY: "${GUARDIAN_SECRET_KEY}"
    FLAGS_ADMIN_USER: "${FLAGS_ADMIN_USER:-admin}"
    FLAGS_ADMIN_PASSWORD: "${FLAGS_ADMIN_PASSWORD}"
    EMBEDDING_API_KEY: "${EMBEDDING_API_KEY}"
    LLM_API_KEY: "${LLM_API_KEY}"
    ANDON_SERVICE_URL: "${ANDON_SERVICE_URL}"
    ANDON_RELAY_TOKEN: "${ANDON_RELAY_TOKEN}"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    OTEL_SERVICE_NAME: "slackex"
    VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY}"
    VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY}"
    VAPID_SUBJECT: "${VAPID_SUBJECT:-mailto:admin@tenun.dev}"
  expose:
    - "4000"
  networks:
    - default
    - proxy

services:
  app1:
    <<: *app-defaults
    container_name: slackex-app-1
    hostname: app1
    labels:
      caddy_0: chat.davewil.dev
      caddy_0.tls.dns: cloudflare {env.CF_API_TOKEN}
      caddy_0.reverse_proxy: "{{upstreams 4000}}"
      caddy_0.reverse_proxy.health_uri: /health
      caddy_0.reverse_proxy.health_interval: 5s
      caddy_0.reverse_proxy.health_timeout: 3s
      caddy_0.reverse_proxy.fail_duration: 15s
      caddy_0.reverse_proxy.health_headers.X-Forwarded-Proto: https
      caddy_1: mcp.davewil.dev
      caddy_1.tls.dns: cloudflare {env.CF_API_TOKEN}
      caddy_1.reverse_proxy: "{{upstreams 4000}}"
    networks:
      default:
      proxy:
        aliases:
          - app1
    environment:
      <<: *app-env
      RELEASE_NODE: "slackex@app1"

  app2:
    <<: *app-defaults
    container_name: slackex-app-2
    hostname: app2
    labels:
      caddy_0: chat.davewil.dev
      caddy_0.reverse_proxy: "{{upstreams 4000}}"
      caddy_1: mcp.davewil.dev
      caddy_1.reverse_proxy: "{{upstreams 4000}}"
    networks:
      default:
      proxy:
        aliases:
          - app2
    environment:
      <<: *app-env
      RELEASE_NODE: "slackex@app2"

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: slackex_prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Observability stack ---

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - default
      # Shared observability net so other homelab apps (e.g. grocery_planner)
      # can push OTLP traces to `otel-collector` by name (grocery_planner-k9c).
      - monitoring

  prometheus:
    image: prom/prometheus:v3.12.0
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=14d'
      - '--storage.tsdb.retention.size=2GB'
      - '--web.enable-remote-write-receiver'
    networks:
      - default
      # Shared observability net so Prometheus can scrape other homelab apps'
      # /metrics by name (e.g. grocery-planner:4000) (grocery_planner-k9c).
      - monitoring

  tempo:
    image: grafana/tempo:2.7.2
    restart: unless-stopped
    # 256m was too small to survive a blocklist poll once the backlog grew:
    # Tempo loads every block meta at startup, OOM'd at ~8s, and so never lived
    # long enough to run a compaction cycle that would shrink the backlog. It
    # cannot compact its way out of that. Incident 2026-07-28 (Linear ENG-57),
    # 3287 restarts. Do not lower without also capping trace volume.
    mem_limit: 1g
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/tempo.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    networks:
      - default

  grafana:
    image: grafana/grafana:13.0.1
    restart: unless-stopped
    mem_limit: 128m
    labels:
      caddy: grafana.davewil.dev
      caddy.tls.dns: cloudflare {env.CF_API_TOKEN}
      caddy.reverse_proxy: "{{upstreams 3000}}"
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - tempo
    networks:
      - default
      - proxy

volumes:
  pgdata:
  redisdata:
  prometheus_data:
  grafana_data:
  tempo_data:

networks:
  proxy:
    external: true
  # Shared observability network. Created once on the host
  # (`docker network create monitoring`); other apps join it to expose /metrics
  # to Prometheus and push OTLP traces to the collector (grocery_planner-k9c).
  monitoring:
    external: true
